## Rebuild all of Arch Linux [core]
[profile."archlinux-core"]
distro = "archlinux"
components = ["core"]
architectures = ["x86_64"]
source = "https://ftp.halifax.rwth-aachen.de/archlinux/$repo/os/$arch"

## Rebuild all of Arch Linux
[profile."archlinux"]
distro = "archlinux"
components = ["core", "extra"]
architectures = ["x86_64"]
source = "https://ftp.halifax.rwth-aachen.de/archlinux/$repo/os/$arch"

## Rebuild packages of specific maintainers, or allow-list packages by name.
## If no filter is set, all packages are imported, if both filters are set the package only
## has to match one of them to be included.
#[profile."archlinux-extra"]
#distro = "archlinux"
#components = ["extra"]
#architectures = ["x86_64"]
#source = "https://ftp.halifax.rwth-aachen.de/archlinux/$repo/os/$arch"
#maintainers = ["somebody"]
#pkgs = ["some-pkg", "python-*"]
#excludes = ["tensorflow*"]

[profile."fedora"]
distro = "fedora"
components = ["Everything"]
architectures = ["x86_64"]
releases = ["rawhide"]
source = "https://ftp.halifax.rwth-aachen.de/fedora/linux/development"

## openSUSE ships a single package index for all architectures, so `noarch`
## packages are imported into each architecture configured here.
## Note the release is part of `source`, `releases` only labels the packages.
[profile."opensuse-tumbleweed"]
distro = "opensuse"
components = ["oss"]
architectures = ["x86_64"]
releases = ["tumbleweed"]
source = "https://download.opensuse.org/tumbleweed/repo"

## Leap inherits most of its packages from SLE. Those are built on the internal
## build.suse.de and can't be rebuilt from the outside, so limit the sync to the
## packages built on build.opensuse.org, which are the ones packaged by openSUSE.
[profile."opensuse-leap-16.0"]
distro = "opensuse"
components = ["oss"]
architectures = ["x86_64"]
releases = ["leap-16.0"]
source = "https://download.opensuse.org/distribution/leap/16.0/repo"
maintainers = ["https://bugs.opensuse.org"]

[profile."debian-main"]
distro = "debian"
components = ["main"]
architectures = ["all", "amd64"]
#releases = ["buster", "sid"]
releases = ["sid"]
source = "http://deb.debian.org/debian"

[profile."debian-unreleased"]
distro = "debian"
components = ["main"]
architectures = ["all", "amd64"]
releases = ["sid", "testing"]
source = "http://deb.debian.org/debian"

[profile."debian-anarchism"]
distro = "debian"
components = ["main"]
architectures = ["all", "amd64"]
releases = ["sid"]
pkgs = ["anarchism"]
source = "http://deb.debian.org/debian"

# a set of packages to test certain edge-cases
[profile."debian-misc"]
distro = "debian"
components = ["main"]
architectures = ["all", "amd64"]
releases = ["sid"]
pkgs = ["anarchism", "binutils-arm-none-eabi", "libglib2.0-bin", "libglib2.0-dev", "sniffglue", "librust-sniffglue-dev", "dfrs", "librust-dfrs-dev"]
source = "http://deb.debian.org/debian"

# example with debug packages from a different source
[profile."debian-telegram"]
distro = "debian"
components = ["main"]
architectures = ["amd64"]
releases = [
    "trixie-backports",
    { name = "trixie-backports-debug", source = "http://deb.debian.org/debian-debug" }
]
pkgs = ["telegram-desktop*"]
source = "http://deb.debian.org/debian"

# Example with .udeb installer packages
[profile."debian-acl-udeb"]
distro = "debian"
components = ["main", "main/debian-installer"]
architectures = ["amd64"]
releases = ["trixie"]
pkgs = ["acl", "acl-udeb"]
source = "http://deb.debian.org/debian"

[profile."tails"]
distro = "tails"
architectures = ["amd64"]
releases = ["stable"]
source = "https://mirrors.wikimedia.org/tails/"

[profile."tails-alpha"]
distro = "tails"
architectures = ["amd64"]
releases = ["alpha"]
source = "https://mirrors.wikimedia.org/tails/"
